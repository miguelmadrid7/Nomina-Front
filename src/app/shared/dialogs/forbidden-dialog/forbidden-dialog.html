<div class="forbidden-dialog">
  <div class="forbidden-dialog-icon-wrap">
    <mat-icon class="forbidden-dialog-icon">lock</mat-icon>
  </div>

  <h2 mat-dialog-title class="forbidden-dialog-title">Acceso denegado</h2>

  <p class="forbidden-dialog-message">
    No tienes permisos para acceder a este módulo o realizar esta operación.
  </p>

  <button mat-flat-button mat-dialog-close class="forbidden-dialog-button">
    Entendido
  </button>
</div>
