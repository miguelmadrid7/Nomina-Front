<div class="dialog-shell">
  <div class="dialog-header dlg-bar">
    <div class="dlg-bar-title">
      Histórico de movimientos · Quincena {{ data.qnaProceso }}@if (data.concepto) { · Concepto {{ data.concepto }} }
    </div>
    <button class="dialog-close" type="button" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <div class="table-container">
      <div class="table-card card">
        <div class="table-content">
          <div class="table-scroll">
            <table mat-table [dataSource]="pagedRows" class="table-global">

              <ng-container matColumnDef="catConceptoCve">
                <th mat-header-cell *matHeaderCellDef class="col-center">
                  <div class="header-filter"><span>CONCEPTO</span></div>
                </th>
                <td mat-cell *matCellDef="let r" class="col-center">{{ r.concepto }}</td>
              </ng-container>

              <ng-container matColumnDef="qnaProceso">
                <th mat-header-cell *matHeaderCellDef class="col-center">
                  <div class="header-filter"><span>QUINCENA</span></div>
                </th>
                <td mat-cell *matCellDef="let r" class="col-center">{{ r.qnaProceso }}</td>
              </ng-container>

              <ng-container matColumnDef="fechaCarga">
                <th mat-header-cell *matHeaderCellDef class="col-center">
                  <div class="header-filter"><span>FECHA DE CARGA</span></div>
                </th>
                <td mat-cell *matCellDef="let r" class="col-center">{{ r.fechaCarga | date:'dd/MM/yyyy HH:mm' }}</td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
          </div>

          <div class="table-footer">
            <mat-paginator
              [length]="totalElements"
              [pageSize]="pageSize"
              [pageIndex]="pageIndex"
              [pageSizeOptions]="[5, 10, 25, 50, 100]"
              showFirstLastButtons
              (page)="onPageChange($event)">
            </mat-paginator>
          </div>
        </div>
      </div>
    </div>
  </mat-dialog-content>
</div>
