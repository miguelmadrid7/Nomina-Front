<div class="dialog-shell">
    <div class="dialog-header dlg-bar">
        <button mat-icon-button class="dialog-close" (click)="cancel()">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <div class="dlg-content">
        <div class="dlg-bar-title"> </div>

        <div class="section-divider"></div>

        <mat-dialog-content *ngIf="form" [formGroup]="form" class="dlg-content">
            <div class="form-grid">
                <div class="row-three">
                    <mat-form-field appearance="outline"  class="qna-compact search-field with-separator" floatLabel="always">
                        <mat-label>Año</mat-label>
                            <input matInput type="number" formControlName="ejercicio" />
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="qna-compact search-field with-separator" floatLabel="always">
                        <mat-label>Quincena</mat-label>
                            <input matInput type="number" formControlName="qna" />
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="qna-compact search-field with-separator" floatLabel="always">
                        <mat-label>Tipo</mat-label>
                            <mat-select formControlName="tipo">
                                <mat-option value="O">Ordinary</mat-option>
                                <mat-option value="E">Extraordinary</mat-option>
                            </mat-select>
                    </mat-form-field>
                </div>

                <mat-form-field appearance="outline" class="qna-compact search-field with-separator" floatLabel="always">
                    <mat-label>Fecha cierre</mat-label>
                        <input matInput [matDatepicker]="pickerCierre" formControlName="fechaCierre" />
                            <mat-datepicker-toggle matSuffix [for]="pickerCierre" />
                            <mat-datepicker #pickerCierre />
                </mat-form-field>

                <mat-form-field appearance="outline" class="qna-compact search-field with-separator" floatLabel="always">
                    <mat-label>Fecha pago</mat-label>
                        <input matInput [matDatepicker]="pickerPago" formControlName="fechaPago" />
                            <mat-datepicker-toggle matSuffix [for]="pickerPago" />
                            <mat-datepicker #pickerPago />
                </mat-form-field>

                <div class="checkbox-group">
                    <mat-checkbox formControlName="movimientos">Movimientos</mat-checkbox>
                    <mat-checkbox formControlName="pension">Pension</mat-checkbox>
                    <mat-checkbox formControlName="juicios">Juicios</mat-checkbox>
                    <mat-checkbox formControlName="terceros">Terceros</mat-checkbox>
                    <mat-checkbox formControlName="activa">Activa</mat-checkbox>
                </div>

            </div>
        </mat-dialog-content>
    </div>

    <div class="dlg-actions">
        <button class="btn btn-danger" (click)="cancel()">Cancel</button>
        <button class="btn btn-primary" [disabled]="form.invalid" (click)="save()">Save</button>
    </div>
</div>
