<div class="dialog-shell">
  <div class="dialog-header dlg-bar">
    <div class="dlg-bar-title">Lotes pendientes de procesar</div>
      <button class="dialog-close" type="button" (click)="close()">
        <mat-icon>close</mat-icon>
      </button>
  </div>

  <mat-dialog-content>
    <div class="table-container">
      <div class="table-card card">
        <div class="table-content">
          <div class="table-scroll">
            <table mat-table [dataSource]="data.lotes" class="table-global">
              
              <ng-container matColumnDef="concepto">
                <th mat-header-cell *matHeaderCellDef class="col-center"> 
                  <div class="header-filter"><span>CONCEPTO</span></div>
                </th>
                <td mat-cell *matCellDef="let l" class="col-center">{{ l.concepto }}</td>
              </ng-container>

              <ng-container matColumnDef="qnaProceso">
                <th mat-header-cell *matHeaderCellDef class="col-center"> 
                  <div class="header-filter">
                    <span>QUINCENA</span>
                  </div>
                </th>
                <td mat-cell *matCellDef="let l" class="col-center">{{ l.qnaProceso }}</td>
              </ng-container>

              <ng-container matColumnDef="total">
                <th mat-header-cell *matHeaderCellDef class="col-center"> 
                  <div class="header-filter">
                    <span>TOTAL</span>
                  </div>
                </th>
                <td mat-cell *matCellDef="let l" class="col-center">{{ l.total }}</td>
              </ng-container>

              <ng-container matColumnDef="aceptados">
                <th mat-header-cell *matHeaderCellDef class="col-center"> 
                  <div class="header-filter">
                    <span>ACEPTADOS</span>
                  </div>
                </th>
                <td mat-cell *matCellDef="let l" class="col-center">{{ l.aceptados }}</td>
              </ng-container>

              <ng-container matColumnDef="rechazados">
                <th mat-header-cell *matHeaderCellDef class="col-center">
                  <div class="header-filter">
                    <span>RECHAZADOS</span>
                  </div>
                </th>
                <td mat-cell *matCellDef="let l" class="col-center" [class.count-danger]="l.rechazados > 0">{{ l.rechazados }}</td>
              </ng-container>

              <ng-container matColumnDef="pendientes">
                <th mat-header-cell *matHeaderCellDef class="col-center">
                  <div class="header-filter">
                    <span>PENDIENTES</span>
                  </div>
                </th>
                <td mat-cell *matCellDef="let l" class="col-center" [class.count-warning]="l.pendientes > 0">{{ l.pendientes }}</td>
              </ng-container>

              <ng-container matColumnDef="fechaCarga">
                <th mat-header-cell *matHeaderCellDef class="col-center">
                  <div class="header-filter">
                    <span>FECHA DE CARGA</span>
                  </div>
                </th>
                <td mat-cell *matCellDef="let l" class="col-center">{{ (l.fechaCarga | date:'dd/MM/yyyy HH:mm') ?? '—' }}</td>
              </ng-container>

              <ng-container matColumnDef="acciones">
                  <th mat-header-cell *matHeaderCellDef class="col-center">
                    <div class="header-filter">
                      <span>ACCIONES</span>
                    </div>
                  </th>
                  <td mat-cell *matCellDef="let l" class="col-center">
                    <button class="btnn btnn-dangerr" type="button" [disabled]="isDeleting" (click)="onDeleteLote(l)">
                      <mat-icon>delete</mat-icon>
                    </button>
                  </td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.lote-activo]="row.qnaProceso === activeQna"></tr>
            </table>
          </div>
          <div class="table-footer">
            <mat-paginator
              [length]="totalElements"
              [pageSize]="pageSize"
              [pageIndex]="pageIndex"
              [pageSizeOptions]="[5, 10, 25, 50, 100]"
              showFirstLastButtons
              (page)="onPageChange($event)">
            </mat-paginator>
          </div>

        </div>
      </div>
    </div>
  </mat-dialog-content>
</div>
