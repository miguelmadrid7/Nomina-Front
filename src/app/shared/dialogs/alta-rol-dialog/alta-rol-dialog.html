<div class="dialog-shell">
  <div class="dialog-header dlg-bar">
    <button mat-icon-button class="dialog-close" (click)="cerrar()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div mat-dialog-content [formGroup]="form" class="dlg-content">

    <div class="dlg-bar-title"> {{ data ? 'Editar rol' : 'Alta de rol' }}</div>

    <div class="section-divider"></div>

    <div class="form-grid">
      <mat-form-field appearance="outline" class="qna-compact search-field with-separator" floatLabel="always">
        <mat-label>Nombre del rol</mat-label>
        <input matInput formControlName="name" appUppercase/>
      </mat-form-field>

      <mat-form-field  appearance="outline" class="qna-compact search-field with-separator description-field" floatLabel="always">
        <mat-label>Descripción</mat-label>
          <textarea matInput formControlName="description" rows="4" appUppercase></textarea>
      </mat-form-field>
    </div>
  </div>

  <div class="dlg-actions">
    <button class="btn btn-danger" (click)="cerrar()">Cancelar</button>
    <button class="btn btn-primary" (click)="guardar()"> {{ data ? 'Actualizar' : 'Guardar' }}</button>
  </div>
</div>
