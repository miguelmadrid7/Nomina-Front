<div class="page-container">
    <div class="page-header">
        <h2 class="page-title">Gestion de usuarios y/o roles</h2>
    </div>

    <div class="section-divider"></div>

    <div class="actions-right">
        <div class="btn-group">
            <button class="btn btn-danger" (click)="clearFilters()">
                <mat-icon>delete_outline</mat-icon>
                <span>Limpiar</span>
            </button>
        </div>
        <button class="btn btn-primary" (click)="buscarUsuario()">
            <mat-icon>search</mat-icon>
            <span>Buscar</span>
        </button>

        <button class="btn btn-success" type="button" (click)="openAltaUsuarioDialog()">
            <mat-icon>person_add</mat-icon>
            <span>Agregar</span>
        </button>
    </div>

    <form [formGroup]="form">
        <div formGroupName="busqueda" class="global-search">
            <mat-form-field appearance="outline" class="qna-compact search-field with-separator" floatLabel="always">
                    <mat-icon matPrefix>search</mat-icon>
                    <mat-label>Buscar (CURP, RFC, Empleado)</mat-label>
                        <input
                            matInput
                            id="buscarUsuario"
                            formControlName="searchText"
                            [matAutocomplete]="auto"
                            #autocompleteTrigger="matAutocompleteTrigger"
                            (keyup.enter)="buscarUsuario()"
                            appUppercase>

                    <mat-autocomplete #auto="matAutocomplete" (optionSelected)="usuarioSeleccionado($event.option.value)" [displayWith]="displayUsuario">
                        <mat-option *ngFor="let emp of resultado" [value]="emp">
                            {{ displayUsuario(emp) }}
                        </mat-option>
                    </mat-autocomplete>
            </mat-form-field>
        </div>
    </form>

    <div class="table-layout">
        <div class="table-section">
            <div class="table-card card">
                <div class="table-content">
                    <div class="table-scroll">
                         <table mat-table [dataSource]="usersDataSource" class="table-global">
                            <ng-container matColumnDef="id">
                                <th mat-header-cell *matHeaderCellDef> ID </th>
                                <td mat-cell *matCellDef="let row"> {{ row.id }} </td>
                            </ng-container>

                            <ng-container matColumnDef="nombreCompleto">
                                <th mat-header-cell *matHeaderCellDef> Usuario </th>
                                <td mat-cell *matCellDef="let row"> {{ row.nombreCompleto }} </td>
                            </ng-container>

                            <ng-container matColumnDef="empleado">
                                <th mat-header-cell *matHeaderCellDef> Detalle </th>
                                <td mat-cell *matCellDef="let row"> {{ row.empleado }} </td>
                            </ng-container>

                            <ng-container matColumnDef="acciones">
                                <th mat-header-cell *matHeaderCellDef> Acciones </th>
                                <td mat-cell *matCellDef="let row">
                                    <button class="btnn btn-succes" type="button" (click)="openUsuarioDialog(row)">
                                        <mat-icon>edit</mat-icon>
                                    </button>
                                    <button class="btnn btn-dangerr" type="button" (click)="openUsuarioDialog(row)">
                                        <mat-icon>delete_outline</mat-icon>
                                    </button>
                                </td>
                            </ng-container>

                            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                         </table>

                         <mat-paginator
                            [pageSize]="10"
                            [pageSizeOptions]="[5,10,25,50]">
                        </mat-paginator>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
