<div class="page-container">
  <div class="page-header">
    <h2 class="page-title">Gestión de salario mínimo</h2>
  </div>

  <div class="section-divider"></div>

  <div class="actions-bar">
    <div class="btn-group">
      <button class="btn btn-primary" (click)="openCreateDialog()">
        <mat-icon>add</mat-icon>
        <span>Agregar</span>
      </button>
    </div>
    
  </div>

  <div class="table-container">
    <div class="table-card card">
      <div class="table-content">
        <div class="table-scroll">
          <table mat-table [dataSource]="dataSource" class="table-global">

            <ng-container matColumnDef="anio">
              <th mat-header-cell *matHeaderCellDef>Año</th>
              <td mat-cell *matCellDef="let e">
                <span class="badge-year">{{ e.anio }}</span>
              </td>
            </ng-container>

            <ng-container matColumnDef="importeDiario">
              <th mat-header-cell *matHeaderCellDef>Importe diario</th>
              <td mat-cell *matCellDef="let e">
                <span class="amount">${{ e.importeDiario | number:'1.2-2' }}</span>
                <span class="amount-label">MXN</span>
              </td>
            </ng-container>

            <ng-container matColumnDef="importeMensual">
              <th mat-header-cell *matHeaderCellDef>Importe mensual</th>
              <td mat-cell *matCellDef="let e">
                <span class="amount">${{ e.importeMensual | number:'1.2-2' }}</span>
                <span class="amount-label">MXN</span>
              </td>
            </ng-container>

            <ng-container matColumnDef="qnaInicio">
              <th mat-header-cell *matHeaderCellDef>QNA inicio</th>
              <td mat-cell *matCellDef="let e">
                <span class="qna-badge">{{ e.qnaInicio }}</span>
              </td>
            </ng-container>

            <ng-container matColumnDef="qnaFin">
              <th mat-header-cell *matHeaderCellDef>QNA fin</th>
              <td mat-cell *matCellDef="let e">
                <span class="qna-badge">{{ e.qnaFin }}</span>
              </td>
            </ng-container>

            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef>Acciones</th>
              <td mat-cell *matCellDef="let e">
                <div class="actions-cell">
                  <button class="btnn btnn-succes" type="button" (click)="openUpdateDialog(e)" title="Editar">
                    <mat-icon>edit</mat-icon>
                  </button>
                  <button class="btnn btnn-dangerr" type="button" (click)="softDeleteParam(e.id)" title="Eliminar">
                    <mat-icon>delete</mat-icon>
                  </button>
                </div>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns" class="sticky-header"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          </table>

          <div class="table-footer">
            <mat-paginator
              [length]="totalElements"
              [pageSize]="50"
              [pageSizeOptions]="[50, 100, 150, 200]"
              showFirstLastButtons
              aria-label="Seleccionar página">
            </mat-paginator>
          </div>

        </div>
      </div>
    </div>
  </div>

</div>
