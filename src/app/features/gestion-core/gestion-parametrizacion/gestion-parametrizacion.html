<div class="page-container">
    <div class="page-header">
        <h2 class="page-title">Parametrización de salario mínimo</h2>
    </div>

    <div class="section-divider"></div>

    <div class="actions-right">
        <div class="btn-group">
            <button class="btn btn-primary" (click)="openCreateDialog()">
                <mat-icon>add</mat-icon>
                <span>Agregar</span>
            </button>
        </div>
    </div>

    <div class="table-container">
        <div class="table-card card"> 
            <div class="table-content">
                <div class="table-scroll">
                    <table mat-table [dataSource]="parametrizacion" class="table-global">
                        <!-- Año -->
                        <ng-container matColumnDef="anio">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> AÑO </th>
                            <td mat-cell *matCellDef="let e">{{ e.anio }}</td>
                        </ng-container>

                        <!-- IMPORTE DIARIO -->
                        <ng-container matColumnDef="importeDiario">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> IMPORTE DIARIO </th>
                            <td mat-cell *matCellDef="let e">${{ e.importeDiario | number:'1.2-2' }} MXN</td>
                        </ng-container>

                        <!-- IMPORTE MENSUAL -->
                        <ng-container matColumnDef="importeMensual">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> IMPORTE MENSUAL </th>
                            <td mat-cell *matCellDef="let e">${{ e.importeMensual | number:'1.2-2' }} MXN</td>
                        </ng-container>

                        <!-- QNA INICIO -->
                        <ng-container matColumnDef="qnaInicio">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> QNA INICIO </th>
                            <td mat-cell *matCellDef="let e">{{ e.qnaInicio }}</td>
                        </ng-container>

                        <!-- QNA FIN -->
                        <ng-container matColumnDef="qnaFin">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> QNA FIN </th>
                            <td mat-cell *matCellDef="let e">{{ e.qnaFin }}</td>
                        </ng-container>

                        <!-- ACCIONES -->
                        <ng-container matColumnDef="actions">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> ACCIONES </th>
                                <td mat-cell *matCellDef="let e">
                                    <button class="btnn btnn-succes" type="button" (click)="openUpdateDialog(e)">
                                        <mat-icon>edit</mat-icon>
                                    </button>
                                    <button class="btnn btnn-dangerr" type="button"  (click)="softDeleteParam(e.id)">
                                        <mat-icon>delete</mat-icon>
                                    </button>
                                </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="sticky-header"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"> </tr>
                    </table>

                    <mat-paginator
                        [length]="totalElements"
                        [pageSize]="50"
                        [pageSizeOptions]="[50, 100, 150, 200]"
                        showFirstLastButtons
                        aria-label="Select page">
                    </mat-paginator>

                </div>
            </div>
        </div>
    </div>

</div>
