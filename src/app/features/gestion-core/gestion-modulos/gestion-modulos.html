<div class="page-container">
    <div class="page-header">
        <h2 class="page-title">Alta y baja de módulos</h2>
    </div>

    <div class="section-divider"></div>

    <div class="actions-right">
        <div class="btn-group">
            <button class="btn btn-succes" (click)="openCreateDialog()">
                <mat-icon>add</mat-icon>
                <span>Agregar</span>
            </button>

        </div>
    </div>

    <div class="table-container">
        <div class="table-card card">  
            <div class="table-content">
                <div class="table-scroll">
                    <table mat-table [dataSource]="modules" class="table-global">
                            <!-- Nombre -->
                            <ng-container matColumnDef="name">
                                <th mat-header-cell *matHeaderCellDef> Nombre </th>
                                <td mat-cell *matCellDef="let e">{{ e.name }}</td>
                            </ng-container>

                            <!-- Descripción -->
                            <ng-container matColumnDef="description">
                                <th mat-header-cell *matHeaderCellDef> Descripción </th>
                                <td mat-cell *matCellDef="let e">{{ e.description }}</td>
                            </ng-container>

                            <!-- Visible -->
                            <ng-container matColumnDef="vista">
                                <th mat-header-cell *matHeaderCellDef> Visible </th>
                                <td mat-cell *matCellDef="let e"> {{ e.vista ? 'Sí' : 'No' }} </td>
                            </ng-container>

                            <!-- Parent -->
                            <ng-container matColumnDef="parent">
                                <th mat-header-cell *matHeaderCellDef> Padre </th>
                                <td mat-cell *matCellDef="let e">{{ e.parent }}</td>
                            </ng-container>

                            <!-- Icon -->
                            <ng-container matColumnDef="icon">
                                <th mat-header-cell *matHeaderCellDef> Ícono </th>
                                <td mat-cell *matCellDef="let e">{{ e.icon }}</td>
                            </ng-container>

                            <!-- Acciones -->
                            <ng-container matColumnDef="actions">
                                <th mat-header-cell *matHeaderCellDef> Acciones </th>
                                
                                <td mat-cell *matCellDef="let e">
                                    <button class="btnn btnn-primary" type="button"  [disabled]="!e.id || detailLoading"  (click)="getModuleById(e.id)">
                                        <mat-icon>edit</mat-icon>
                                    </button>

                                    <button class="btnn btnn-dangerr" type="button" [disabled]="!e.id || loadingModuleId === e.id" (click)="softDeleteModule(e.id)">
                                        <mat-icon>delete</mat-icon>
                                    </button>
                                </td>
                            </ng-container>

                        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="sticky-header"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.inactive-row]="row?.status === 'INACTIVO'" [attr.aria-disabled]="row?.status === 'INACTIVO'"> </tr>
                    </table>
                    <mat-paginator
                        [length]="totalElements"
                        [pageSize]="50"
                        [pageSizeOptions]="[50, 100, 150, 200]"
                        showFirstLastButtons
                        aria-label="Select page">
                    </mat-paginator>

                </div>
            </div>
        </div>
    </div>
</div>
