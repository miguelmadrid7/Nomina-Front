<div class="page-container">
    <div class="page-header">
        <h2 class="page-title">Alta y baja de módulos</h2>
    </div>

    <div class="section-divider"></div>

    <div class="actions-right">
        <div class="btn-group">
            <button class="btn btn-succes" (click)="openCreateDialog()">
                <mat-icon>add</mat-icon>
                <span>Agregar</span>
            </button>
        </div>
    </div>

    <div class="table-container">
        <div class="table-card card">  
            <div class="table-content">
                <div class="table-scroll">
                    <table mat-table [dataSource]="modules" class="table-global">
                            <ng-container matColumnDef="name">
                                <th mat-header-cell *matHeaderCellDef class="col-lg col-center"> NOMBRE </th>
                                <td mat-cell *matCellDef="let e" class="col-lg col-center col-wrap">
                                    <span class="badge-year"> {{ e.name }} </span>
                                </td>
                            </ng-container>

                            <ng-container matColumnDef="description">
                                <th mat-header-cell *matHeaderCellDef class="col-lg col-center"> DESCRIPCIÓN </th>
                                <td mat-cell *matCellDef="let e" class="col-lg col-center col-wrap">{{ e.description }}</td>
                            </ng-container>

                            <ng-container matColumnDef="vista">
                                <th mat-header-cell *matHeaderCellDef class="col-lg col-center"> VISIBLE </th>
                                <td mat-cell *matCellDef="let e" class="col-lg col-center col-wrap"> {{ e.vista ? 'Sí' : 'No' }} </td>
                            </ng-container>

                            <ng-container matColumnDef="parent">
                                <th mat-header-cell *matHeaderCellDef class="col-lg col-center"> PADRE </th>
                                <td mat-cell *matCellDef="let e" class="col-lg col-center col-wrap">{{ e.parent }}</td>
                            </ng-container>

                            <ng-container matColumnDef="icon">
                                <th mat-header-cell *matHeaderCellDef class="col-xs col-center"> ÍCONO </th>
                                <td mat-cell *matCellDef="let e" class="col-xs col-center col-wrap">{{ e.icon }}</td>
                            </ng-container>

                            <ng-container matColumnDef="actions">
                                <th mat-header-cell *matHeaderCellDef class="col-xs col-center actions-col"> ACCIONES </th>
                                    <td mat-cell *matCellDef="let e" class="col-sm col-center actions-col">
                                        
                                        <div class="actions-cell">
                                            <button class="btnn btnn-primary" type="button"  [disabled]="!e.id || detailLoading"  (click)="getModuleById(e.id)">
                                                <mat-icon>edit</mat-icon>
                                            </button>

                                            <button class="btnn btnn-dangerr" type="button" [disabled]="!e.id || loadingModuleId === e.id" (click)="softDeleteModule(e.id)">
                                                <mat-icon>delete</mat-icon>
                                            </button>
                                        </div>

                                    </td>
                            </ng-container>

                        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="sticky-header"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.inactive-row]="row?.status === 'INACTIVO'" [style.font-weight]="isParentModule(row) ? '700' : null" [attr.aria-disabled]="row?.status === 'INACTIVO'"> </tr>
                    </table>

                </div>
                <div class="table-footer">
                    <mat-paginator
                        [length]="totalModules"
                        [pageSize]="pageSize"
                        [pageIndex]="pageIndex"
                        [pageSizeOptions]="[5, 10, 25, 50, 100]"
                        showFirstLastButtons
                        (page)="onPageChange($event)">
                    </mat-paginator>
                </div>
            </div>
        </div>
    </div>
</div>
