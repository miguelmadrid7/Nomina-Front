<div class="page-container">
    <div class="page-header">
        <h2 class="page-title">Gestión de roles</h2>
    </div>

    <div class="section-divider"></div>

    <div class="actions-right">
        <div class="btn-group">
            <button class="btn btn-primary" type="button" (click)="openAltaRoleDialog()">
                <mat-icon>add</mat-icon>
                <span>Agregar</span>
            </button>
        </div>
    </div>

    <div class="table-container">
        <div class="table-card card">
            <div class="table-content">
                <div class="table-scroll">
                    <table mat-table [dataSource]="dataSource" class="table-global">
                            <ng-container matColumnDef="rol" >
                                <th mat-header-cell *matHeaderCellDef class="col-xl col-center"> ROL </th>
                                <td mat-cell *matCellDef="let row" class="col-xl col-center col-wrap"> {{ row.name }} </td>
                            </ng-container>

                            <ng-container matColumnDef="padre">
                                <th mat-header-cell *matHeaderCellDef class="col-xl col-center"> MÓDULOS </th>
                                <td mat-cell *matCellDef="let row" class="col-xl col-center col-wrap">
                                    <ng-container *ngIf="getRoleModules(row).length; else noModules">
                                        <div *ngFor="let module of getRoleModules(row)">{{ module }}</div>
                                    </ng-container>
                                    <ng-template #noModules>Sin módulos</ng-template>
                                </td>
                            </ng-container>

                            <ng-container matColumnDef="acciones">
                                <th mat-header-cell *matHeaderCellDef class="col-xl col-center"> ACCIONES </th>
                                <td mat-cell *matCellDef="let row" class="col-xl col-center actions-col col-wrap"> 
                                    
                                    <div class="actions-cell">
                                        <button class="btnn btn-succes" type="button" (click)="openEditRoleDialog(row)">
                                            <mat-icon>edit</mat-icon>
                                        </button>
                                        <button class="btnn btnn-dangerr" type="button" (click)="softDeleteRole(row)">
                                            <mat-icon>delete_outline</mat-icon>
                                        </button> 
                                    </div>
                                </td>
                            </ng-container>

                            <tr mat-header-row *matHeaderRowDef="displayedColumns" class="sticky-header"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                        </table>

                    </div>
                    <div class="table-footer">
                        <mat-paginator
                            [length]="totalRoles"
                            [pageSize]="pageSize"
                            [pageIndex]="pageIndex"
                            [pageSizeOptions]="[5, 10, 25, 50, 100]"
                            showFirstLastButtons
                            (page)="onPageChange($event)">
                        </mat-paginator>
                    </div>
                </div>
            </div>
        
    </div>
</div>
