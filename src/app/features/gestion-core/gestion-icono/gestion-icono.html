<div class="page-container">
  <div class="page-header page-header--split">
    <h2 class="page-title">Alta y baja de iconos</h2>

    <div class="header-tools">
            <div class="qna-chip" role="status">
                <mat-icon>event</mat-icon>
                <div class="qna-chip__text">
                    <span class="qna-chip__label">Quincena activa</span>
                    <span class="qna-chip__value">{{ cargandoQna ? 'Cargando...' : (calendarioActual ? calendarioActual.qna.toString().padStart(2, '0') + ' / ' + calendarioActual.ejercicio : 'No disponible') }}</span>
                </div>
            </div>
        </div>
  </div>

  <div class="section-divider"></div>

  <div class="actions-right">
    <div class="btn-group">
      <button class="btn btn-success" type="button" (click)="openCreateDialog()">
        <mat-icon>add</mat-icon>
        <span>Agregar</span>
      </button>
    </div>
  </div>

  <div class="table-containe">
    <div class="table-card card">
      <div class="table-conten">
        <div class="table-scroll">
           <table mat-table class="table-global">

           </table>
        </div>

        <div class="table-footer">
          <mat-paginator>
          </mat-paginator>
        </div>
      </div>
    </div>
  </div>
</div>
