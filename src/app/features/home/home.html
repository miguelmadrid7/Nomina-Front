<theme-selector></theme-selector>

<app-header (toggleSidebarClick)="toggleSidebar()"></app-header>

<main class="home-shell d-flex" [class.sidebar-collapsed]="isSidebarCollapsed">

  <!-- SIDEBAR DESKTOP -->
  <div class="sidebar-wrapper d-none d-lg-block">
    <sidebar></sidebar>
  </div>

  <!-- SIDEBAR MÓVIL (offcanvas) -->
  <div class="offcanvas offcanvas-start d-lg-none"
       tabindex="-1"
       id="sidebarMobile"
       aria-labelledby="sidebarMobileLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title text-white" id="sidebarMobileLabel">Menú</h5>
      <button type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="offcanvas"
              aria-label="Cerrar">
      </button>
    </div>
    <div class="offcanvas-body p-0">
      <sidebar></sidebar>
    </div>
  </div>

  <!-- CONTENIDO -->
  <div class="content-shell">
    <div class="page-header container-fluid py-3 px-4">
      <h4 class="page-title mb-1">
        {{ breadcrumbs[breadcrumbs.length - 1].label }}
      </h4>
      <nav>
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item"
              *ngFor="let breadcrumb of breadcrumbs; let last = last">
            <a *ngIf="!last" [routerLink]="breadcrumb.url">{{ breadcrumb.label }}</a>
            <span *ngIf="last">{{ breadcrumb.label }}</span>
          </li>
        </ol>
      </nav>
    </div>
    <div class="container-fluid p-4">
      <router-outlet></router-outlet>
    </div>
  </div>

</main>
