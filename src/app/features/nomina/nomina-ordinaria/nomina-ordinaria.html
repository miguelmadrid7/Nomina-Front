<div class="page-header">
  <h2 class="page-title">Nómina ordinaria</h2>
</div>

<div class="section-divider"></div>

<div class="actions-right">
  <button mat-raised-button class="btn-component" (click)="clearFilters()">
    Limpiar filtros
  </button>
</div>

<div class="global-search">
  <mat-form-field appearance="outline" class="qna-compact search-field" floatLabel="always" >
    <mat-label>Buscar (CURP, RFC, Empleado)</mat-label>
    <input matInput
    [(ngModel)]="search"
      (input)="enforceUppercase($event)"
      (keyup.enter)="applySearchFilter()"/>
  </mat-form-field>

   <div class="qna-filters">

    <mat-form-field appearance="outline" class="qna-compact" floatLabel="always" >
      <mat-label>Año</mat-label>
      <mat-select [(ngModel)]="anioSeleccionado" (ngModelChange)="onQnaChange()">
        <mat-option *ngFor="let anio of anios" [value]="anio">
          {{ anio }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="qna-compact" floatLabel="always" >
      <mat-label>Quincena</mat-label>
      <mat-select [(ngModel)]="quincenaSeleccionada" (ngModelChange)="onQnaChange()">
        <mat-option *ngFor="let q of quincenas" [value]="q">
          {{ q.toString().padStart(2,'0') }}
        </mat-option>
      </mat-select>
    </mat-form-field>

  </div>
</div>


<div class="table-container" *ngIf="showRecords">
  <div class="table-card card">
    <div class="table-content">
      <div class="table-scroll">
        <table mat-table [dataSource]="dataSource" class="table-global">

          <ng-container matColumnDef="curp">
            <th mat-header-cell *matHeaderCellDef>
              <div class="header-filter">
                <span>CURP</span>
                
              </div>
            </th>
            <td mat-cell *matCellDef="let e">{{ e.curp }}</td>
          </ng-container>

          <ng-container matColumnDef="rfc">
            <th mat-header-cell *matHeaderCellDef>
              <div class="header-filter">
                <span>RFC</span>
                
              </div>
            </th>
            <td mat-cell *matCellDef="let e">{{ e.rfc }}</td>
          </ng-container>

          <ng-container matColumnDef="nombreEmpleado">
            <th mat-header-cell *matHeaderCellDef>
              <div class="header-filter">
                <span>EMPLEADO</span>
                
              </div>
            </th>
            <td mat-cell *matCellDef="let e">{{ e.nombreEmpleado }}</td>
          </ng-container>

          <ng-container matColumnDef="qnaProceso">
            <th mat-header-cell *matHeaderCellDef>QNA PROCESO</th>
            <td mat-cell *matCellDef="let e">{{ e.qnaProceso }}</td>
          </ng-container>


           <ng-container matColumnDef="clavePlaza">
            <th mat-header-cell *matHeaderCellDef>CLAVE PLAZA</th>
            <td mat-cell *matCellDef="let e">{{ e.clavePlaza }}</td>
          </ng-container>

          <ng-container matColumnDef="baseCalculoIsr">
            <th mat-header-cell *matHeaderCellDef>BASE CÁLCULO ISR</th>
            <td mat-cell *matCellDef="let e">{{ e.baseCalculoIsr }}</td>
          </ng-container>

          <ng-container matColumnDef="conceptoDetalle">
            <th mat-header-cell *matHeaderCellDef>ACCIONES</th>
            <td mat-cell *matCellDef="let e">
              <button mat-button color="primary" (click)="openConceptosDialog(e)">
               <mat-icon>visibility</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>

      <div class="table-footer">
        <mat-paginator
          [length]="totalElements"
          [pageSize]="50"
          [pageSizeOptions]="[50, 100, 150, 200]"
          showFirstLastButtons
          aria-label="Select page">
        </mat-paginator>
      </div>
    </div>
  </div>
</div>
